[project]
name = "udc-reference-config"
version = "0.0.0"
description = "The reference configuration of PRD §13.3: the DuckDB CLI driven by a script, and its interruption tests (H2)"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.44,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=refconf --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
